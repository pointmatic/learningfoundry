[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learningfoundry"
dynamic = ["version"]
description = "A curriculum engine that turns a YAML curriculum definition into a deployable SvelteKit learning application."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Pointmatic" },
]
keywords = ["curriculum", "elearning", "sveltekit", "education", "lms"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "pydantic>=2.0",
    "click>=8.1",
]

[project.optional-dependencies]
quizazz = [
    "quizazz>=1.4",
]
nbfoundry = [
    # >=0.46.0 is the first release honoring the Option-C `compile_exercise`
    # contract (returns `notebook_source` + banner metadata; consumer-
    # dependency-spec BR-1). Pre-0.46 returns the retired Option-B dict, which
    # the resolver's `notebook_source` pop cannot consume (Story K.j.3).
    "nbfoundry>=0.46",
]

[project.urls]
Homepage = "https://github.com/pointmatic/learningfoundry"
Repository = "https://github.com/pointmatic/learningfoundry"
"Bug Tracker" = "https://github.com/pointmatic/learningfoundry/issues"
Changelog = "https://github.com/pointmatic/learningfoundry/blob/main/CHANGELOG.md"

[project.scripts]
learningfoundry = "learningfoundry.cli:main"

# Single-source the package version from `__version__` in the package's
# `__init__.py` (Story K.k). The default `regex` source reads `__version__`.
[tool.hatch.version]
path = "src/learningfoundry/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/learningfoundry"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "B"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = "quizazz"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nbfoundry"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/learningfoundry"]
omit = ["*/sveltekit_template/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/test_smoke_sveltekit.py"
markers = [
    "smoke: end-to-end SvelteKit build tests (requires pnpm, slow)",
]
